<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<title>日経平均株価 3Dジェットコースター</title>
		<meta name="description" content="1990年からの日経平均株価（週次終値）をレールの高さにした、山手線一周のジェットコースター。株価の上げ下げを一人称視点で体感できます。">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#0b1733">
		<link rel="icon" href="data:,">
		<link type="text/css" rel="stylesheet" href="./assets/css/main.css">
	</head>
	<body>
		<!-- 各ブロックの中身は担当が書く。id と ARIA の枠は変えない（契約は specs/contract.md）。 -->

		<!-- [start-screen] CSS: start.css / JS: ui/start.js -->
		<div id="start-screen">
			<h1>日経平均株価<br/>3Dジェットコースター</h1>
			<p>過去30年の株価変動を体感する</p>
			<button id="start-btn" disabled>START RIDE</button>
			<p id="start-message" role="status" hidden></p>
			<p id="start-credits"></p>
		</div>

		<!-- [hud] START 後に .visible が付く。スロットの配置は hud.css -->
		<div id="hud">
			<!-- [hud-readout] 現在値の帯  CSS: readout.css / JS: hud/readout.js -->
			<div id="hud-readout" class="hud-panel" role="group" aria-label="現在値">
				<div id="year-display"></div>
			</div>
			<!-- [hud-legend] 凡例（俯瞰中だけ）  CSS: readout.css / JS: hud/legend.js -->
			<div id="hud-legend" role="group" aria-label="凡例"></div>
			<!-- [hud-controls] 操作ボタン  CSS: controls.css / JS: ui/buttons.js -->
			<div id="hud-controls" role="group" aria-label="操作"></div>
			<!-- [hud-chart] ミニグラフ  CSS: chart.css / JS: hud/chart.js -->
			<div id="hud-chart" class="hud-panel">
				<canvas id="graphCanvas" width="296" height="140" role="img" aria-label="日経平均株価の折れ線グラフ"></canvas>
			</div>
			<!-- [hud-map] 路線図  CSS: map.css / JS: hud/map.js -->
			<div id="hud-map" class="hud-panel">
				<canvas id="mapCanvas" width="176" height="200" role="img" aria-label="山手線の路線図"></canvas>
			</div>
			<!-- [hud-caption] イベントキャプション  CSS: annotations.css / JS: hud/annotations.js -->
			<div id="hud-caption" role="status" aria-live="polite"></div>
		</div>

		<!-- [end-screen] 終了画面  CSS: endscreen.css / JS: ui/endscreen.js。見出しは #end-title を作ること -->
		<div id="end-screen" role="dialog" aria-modal="true" aria-labelledby="end-title" hidden>
			<div class="end-card">
				<h2 id="end-title" class="end-title">一周しました</h2>
				<p id="end-lead" class="end-lead"></p>
				<p id="end-sample-note" class="end-note" hidden>サンプルデータ（実際の日経平均ではありません）</p>
				<dl class="end-stats">
					<div class="end-stat" data-stat="first">
						<dt>最初の週</dt>
						<dd class="end-stat__value tabular"><span class="end-stat__num"></span><span class="end-stat__unit">円</span></dd>
						<dd class="end-stat__date tabular"></dd>
					</div>
					<div class="end-stat" data-stat="last">
						<dt>最後の週</dt>
						<dd class="end-stat__value tabular"><span class="end-stat__num"></span><span class="end-stat__unit">円</span></dd>
						<dd class="end-stat__date tabular"></dd>
					</div>
					<div class="end-stat" data-stat="max">
						<dt>最高値</dt>
						<dd class="end-stat__value tabular"><span class="end-stat__num"></span><span class="end-stat__unit">円</span></dd>
						<dd class="end-stat__date tabular"></dd>
					</div>
					<div class="end-stat" data-stat="min">
						<dt>最安値</dt>
						<dd class="end-stat__value tabular"><span class="end-stat__num"></span><span class="end-stat__unit">円</span></dd>
						<dd class="end-stat__date tabular"></dd>
					</div>
				</dl>
				<p id="end-change" class="end-change tabular"></p>
				<div class="end-actions">
					<button type="button" id="end-restart" class="btn btn--primary end-restart">もう一度乗る</button>
					<button type="button" id="end-overview" class="btn end-overview">俯瞰で全体を見る</button>
				</div>
			</div>
		</div>

		<!-- [info-panel] 情報パネル  CSS: infopanel.css / JS: ui/infopanel.js。見出しは #info-title を作ること -->
		<div id="info-panel" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden></div>

		<!-- [live-region] 読み上げ用（視覚的に隠す）。ctx.ui.announce( text ) で書き込む -->
		<div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "./assets/js/three.module.js",
					"three/addons/": "./assets/jsm/"
				}
			}
		</script>
		<script type="module" src="./assets/js/main.js"></script>
	</body>
</html>

<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js vr - roller coaster</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link type="text/css" rel="stylesheet" href="./assets/css/main.css">
	</head>
	<body>
		<div id="ui-overlay">
			<div id="start-screen">
				<h1>日経平均株価<br/>3Dジェットコースター</h1>
				<p>過去30年の株価変動を体感する</p>
				<button id="start-btn">START RIDE</button>
			</div>
			<div id="year-display"></div>
			<div id="controls-info"><strong>W</strong> for overview &nbsp; | &nbsp; <strong>SPACE</strong> to pause</div>
		</div>
		<canvas id="graphCanvas" width="200" height="200"></canvas>
		<canvas id="mapCanvas" width="200" height="200"></canvas>
		<script type="importmap">
			{
				"imports": {
					"three": "./assets/js/three.module.js",
					"three/addons/": "./assets/jsm/"
				}
			}
		</script>
		<script type="module" src="./assets/js/main.js"></script>

	</body>
</html>
